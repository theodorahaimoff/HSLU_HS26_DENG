kestra:
  server:
    basicAuth:
      username: "${KESTRA_LOGIN_USER}"
      password: "${KESTRA_LOGIN_PASSWORD}"
  tutorialFlows:
    enabled: false
  repository:
    type: postgres
  queue:
    type: postgres
  storage:
    type: local
    local:
      basePath: /app/storage
  tasks:
    tmpDir:
      path: /tmp/kestra-wd
  plugins:
    configurations:
      - type: io.kestra.plugin.scripts.runner.docker.Docker
        values:
          volume-enabled: true